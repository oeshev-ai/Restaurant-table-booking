<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Система бронирования столов</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-wrap">
    <section class="panel form-panel login-panel">
      <h1>Система бронирования столов</h1>
      <h2>Вход</h2>
      {% if error %}<p class="message error">{{ error }}</p>{% endif %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Email<input name="email" type="email" value="{{ email }}" required autofocus autocomplete="username"></label>
        <label>Пароль<input name="password" type="password" required autocomplete="current-password"></label>
        <div class="actions">
          <button type="submit">Войти</button>
        </div>
      </form>
      <p class="login-hint">Доступ только для администраторов и сотрудников.</p>
    </section>
  </main>
</body>
</html>
