{% extends "base.html" %}
{% block title %}{% if table_id %}Изменить стол{% else %}Новый стол{% endif %}{% endblock %}
{% block content %}
<section class="panel form-panel">
  <h2>{% if table_id %}Изменить стол{% else %}Новый стол{% endif %}</h2>
  {% if error %}<p class="message error">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if table_id %}
    <label>ID<input value="{{ table_id }}" readonly></label>
    {% endif %}
    <label>Номер стола<input name="number" type="number" min="1" value="{{ form.number }}" required></label>
    <label>Вместимость<input name="seats" type="number" min="1" value="{{ form.seats }}" required></label>
    <label>Расположение<input name="zone" value="{{ form.zone }}"></label>
    <label class="check"><input type="checkbox" name="is_active" {% if form.is_active %}checked{% endif %}> Активен</label>
    <div class="actions">
      <button type="submit">Сохранить</button>
      <a class="button" href="{{ url_for('tables', id=table_id) if table_id else url_for('tables') }}">Отмена</a>
    </div>
  </form>
</section>
{% endblock %}
